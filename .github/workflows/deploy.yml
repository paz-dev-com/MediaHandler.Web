name: Deploy Web

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mediahandler-web
  WEB_ROOT: /srv/docker/mediahandler/web

# GHCR requires packages:write to push images
permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 – Build Angular image and push to GHCR (GitHub-hosted runner)
  # Auth0 credentials are compiled into the bundle via build-args.
  # Keep this image PRIVATE (credentials visible in Docker layer history).
  # ─────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Web image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${{ github.sha }}"
          git reset --hard FETCH_HEAD
          git clean -df

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Debug build context
        run: ls -la

      - name: Build & push
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          APP_HOST="${{ secrets.APP_HOST }}"
          docker build \
            --tag "${{ env.IMAGE_NAME }}:${IMAGE_TAG}" \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            --build-arg API_BASE_URL=/api/v1 \
            --build-arg PROD_API_BASE_URL=/api/v1 \
            --build-arg AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
            --build-arg AUTH0_CLIENT_ID="${{ secrets.AUTH0_CLIENT_ID }}" \
            --build-arg AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
            --build-arg AUTH0_REDIRECT_URI="https://${APP_HOST}/auth/callback" \
            --build-arg PROD_AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
            --build-arg PROD_AUTH0_REDIRECT_URI="https://${APP_HOST}/auth/callback" \
            .
          docker push "${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          docker push "${{ env.IMAGE_NAME }}:latest"
          echo "Pushed: ${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 – Extract Angular dist to server disk, reload Caddy
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to jarvis
    runs-on: [self-hosted, jarvis]
    needs: build-push

    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Ensure web directory exists
        run: mkdir -p "${{ env.WEB_ROOT }}"

      - name: Extract dist to /srv/docker/mediahandler/web
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}"
          docker pull "${IMAGE}"
          docker run --rm \
            -v "${{ env.WEB_ROOT }}:/output" \
            "${IMAGE}" \
            sh -c "cp -rp /app/dist/browser/browser/. /output/"
          echo "Angular dist extracted to ${{ env.WEB_ROOT }}"
          ls -la "${{ env.WEB_ROOT }}" | head -10

      - name: Reload Caddy
        run: sudo systemctl reload caddy

      - name: Verify index.html deployed
        run: |
          if [[ -f "${{ env.WEB_ROOT }}/index.html" ]]; then
            echo "index.html present"
          else
            echo "::error::index.html missing in ${{ env.WEB_ROOT }}"
            exit 1
          fi

      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io || true
